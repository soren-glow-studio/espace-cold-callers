<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace Callers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a34;--tx:#e8eaf0;--mut:#8a90a2;--ac:#4f8cff;--ok:#2fbf71;--warn:#f0b429}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#e2e5ec;--tx:#1b1e27;--mut:#6a7185}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{margin-right:auto}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px}h3{margin:0 0 8px;font-size:15px}
.mut{color:var(--mut)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.big{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500;font-size:13px}
tr.me td{background:rgba(79,140,255,.15);font-weight:600}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px}
iframe{width:100%;border:0;border-radius:10px;background:#000}
.err{color:#ff6b6b;margin-top:8px}.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = 'https://zwaipemeyefkxigohyof.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BA9ZVTPRd5fIUZUxFgQesw_LR3JoX9r';
const NOTION_URL = ''; // lien public Notion des scripts (à renseigner)
const MEET_URL = '';   // lien Google Meet fixe (optionnel)
const GOAL = 50, STREAK_GOAL = 30;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const isWeekday = d => { const w = d.getDay(); return w >= 1 && w <= 5; };

let S = { user:null, profile:null, stats:{}, items:[], done:new Set(), lessons:[], ldone:new Set(), tab:'accueil', period:'jour', openLesson:null, editDay:null };

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return renderLogin();
  S.user = session.user;
  await loadAll();
  render();
}

function renderLogin(msg=''){
  $app.innerHTML = `<main style="max-width:380px;margin-top:10vh"><div class="card"><h2>Espace Callers</h2>
  <label>E-mail</label><input id="em" type="email" autocomplete="username">
  <div style="height:10px"></div><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <div style="height:14px"></div><button class="btn pri" id="go" style="width:100%">Connexion</button><div class="err">${esc(msg)}</div></div></main>`;
  const go = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
    if(error) renderLogin('Identifiants incorrects.'); else init();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if(e.key==='Enter') go(); };
}

async function loadAll(){
  const uid = S.user.id;
  const [p, st, it, dn, ls, ld] = await Promise.all([
    sb.from('profiles').select('*').eq('id', uid).single(),
    sb.from('daily_stats').select('*').eq('user_id', uid),
    sb.from('checklist_items').select('*').order('position'),
    sb.from('checklist_done').select('item_id').eq('user_id', uid),
    sb.from('lessons').select('*').order('position'),
    sb.from('lessons_done').select('lesson_id').eq('user_id', uid)
  ]);
  S.profile = p.data;
  S.stats = {}; (st.data||[]).forEach(r => S.stats[r.day] = r);
  S.items = it.data||[]; S.done = new Set((dn.data||[]).map(r=>r.item_id));
  S.lessons = ls.data||[]; S.ldone = new Set((ld.data||[]).map(r=>r.lesson_id));
}

function streak(){
  let n = 0, d = new Date();
  const t = today();
  if(isWeekday(d)){ if((S.stats[t]?.answered||0) >= GOAL) n++; }
  for(let i=0;i<400;i++){
    d.setDate(d.getDate()-1);
    if(!isWeekday(d)) continue;
    if((S.stats[ymd(d)]?.answered||0) >= GOAL) n++; else break;
  }
  return n;
}

function render(){
  const admin = S.profile?.role === 'admin';
  const tabs = [['accueil','Accueil'],['saisie','Mes stats'],['classement','Classement'],['formation','Formation'],['scripts','Scripts']];
  if(admin) tabs.push(['admin','Admin']);
  $app.innerHTML = `<header><b>Espace Callers</b><nav class="row">${tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav>
  <button class="btn" id="out">Déconnexion</button></header><main id="view"></main>`;
  $app.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  ({accueil:vAccueil, saisie:vSaisie, classement:vClassement, formation:vFormation, scripts:vScripts, admin:vAdmin})[S.tab]();
}
const view = () => document.getElementById('view');

function vAccueil(){
  const t = S.stats[today()]; const ans = t?.answered||0; const st = streak();
  const pct = Math.min(100, Math.round(ans/GOAL*100));
  const dn = S.items.filter(i=>S.done.has(i.id)).length;
  view().innerHTML = `
  <div class="card"><h2>Bonjour ${esc(S.profile.name)} 👋</h2>
    <div class="grid">
      <div><h3>Objectif du jour</h3><div class="big">${ans} / ${GOAL} décrochés</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div><h3>Série bonus 100 €</h3><div class="big">${Math.min(st,STREAK_GOAL)} / ${STREAK_GOAL} jours</div><div class="bar"><i style="width:${Math.min(100,st/STREAK_GOAL*100)}%"></i></div>
      <div class="mut" style="font-size:13px;margin-top:4px">Jours ouvrés d'affilée (lun-ven) avec ${GOAL}+ décrochés</div></div>
    </div></div>
  <div class="card"><h2>💰 Rémunération</h2>
    <p style="margin:0 0 6px"><b>3 % de chaque vente signée</b> : panier moyen 1 500 à 3 500 €, soit <b>45 à 105 € (≈ 225 000 à 525 000 Ar)</b> par signature.</p>
    <p style="margin:0"><b>+100 € (≈ 500 000 Ar)</b> si tu fais ${GOAL} décrochés par jour, du lundi au vendredi, pendant ${STREAK_GOAL} jours d'affilée.</p></div>
  <div class="card"><h2>🚀 Roadmap d'onboarding <span class="mut">(${dn}/${S.items.length})</span></h2>
    <div class="bar" style="margin-bottom:8px"><i style="width:${S.items.length?dn/S.items.length*100:0}%"></i></div>
    ${S.items.map(i=>`<label class="chk" style="color:var(--tx);font-size:15px;margin:0"><input type="checkbox" data-i="${i.id}" ${S.done.has(i.id)?'checked':''}>${esc(i.label)}</label>`).join('')}</div>
  ${MEET_URL?`<div class="card"><h2>🎥 Salle de motivation</h2><a class="btn" href="${esc(MEET_URL)}" target="_blank" rel="noopener">Rejoindre (caméra uniquement)</a></div>`:''}`;
  view().querySelectorAll('[data-i]').forEach(c => c.onchange = async () => {
    const id = +c.dataset.i;
    if(c.checked){ await sb.from('checklist_done').insert({user_id:S.user.id,item_id:id}); S.done.add(id); }
    else { await sb.from('checklist_done').delete().eq('user_id',S.user.id).eq('item_id',id); S.done.delete(id); }
    vAccueil();
  });
}

async function vSaisie(){
  const day = S.editDay || today(); const r = S.stats[day] || {};
  view().innerHTML = `<div class="card"><h2>Mes chiffres du jour</h2>
    <div class="grid"><div><label>Date</label><input type="date" id="d" value="${day}" max="${today()}"></div>
    <div><label>Appels passés</label><input type="number" min="0" id="c" value="${r.calls??''}"></div>
    <div><label>Décrochés</label><input type="number" min="0" id="a" value="${r.answered??''}"></div>
    <div><label>Rendez-vous pris</label><input type="number" min="0" id="m" value="${r.meetings??''}"></div></div>
    <div style="height:12px"></div><button class="btn pri" id="save">Enregistrer</button> <span id="msg" class="mut"></span></div>
  <div class="card"><h2>Historique des modifications</h2><div id="hist" class="mut">Chargement…</div></div>
  <div class="card"><h2>14 derniers jours</h2><div id="last"></div></div>`;
  const dEl = document.getElementById('d');
  dEl.onchange = () => { S.editDay = dEl.value; vSaisie(); };
  document.getElementById('save').onclick = async () => {
    const v = id => Math.max(0, parseInt(document.getElementById(id).value||'0',10) || 0);
    const row = { user_id:S.user.id, day:dEl.value, calls:v('c'), answered:v('a'), meetings:v('m') };
    if(row.answered > row.calls) return document.getElementById('msg').textContent = '⚠️ Décrochés ne peut pas dépasser les appels.';
    if(row.meetings > row.answered) return document.getElementById('msg').textContent = '⚠️ Rendez-vous ne peut pas dépasser les décrochés.';
    const { error } = await sb.from('daily_stats').upsert(row, { onConflict:'user_id,day' });
    if(error) return document.getElementById('msg').textContent = 'Erreur : ' + error.message;
    S.stats[row.day] = row; document.getElementById('msg').textContent = '✅ Enregistré'; histLoad(row.day); lastRender();
  };
  const histLoad = async d => {
    const { data } = await sb.from('stat_history').select('*').eq('user_id',S.user.id).eq('day',d).order('changed_at',{ascending:false});
    document.getElementById('hist').innerHTML = (data&&data.length) ? `<table><tr><th>Modifié le</th><th>Appels</th><th>Décrochés</th><th>RDV</th></tr>${data.map(h=>`<tr><td>${new Date(h.changed_at).toLocaleString('fr-FR')}</td><td>${h.calls}</td><td>${h.answered}</td><td>${h.meetings}</td></tr>`).join('')}</table>` : 'Aucune saisie pour cette date.';
  };
  const lastRender = () => {
    const rows = []; const d = new Date();
    for(let i=0;i<14;i++){ const k = ymd(d); rows.push([k, S.stats[k]]); d.setDate(d.getDate()-1); }
    document.getElementById('last').innerHTML = `<table><tr><th>Date</th><th>Appels</th><th>Décrochés</th><th>RDV</th><th></th></tr>${rows.map(([k,s])=>`<tr><td>${parse(k).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td>${s?s.calls:'-'}</td><td>${s?s.answered:'-'}</td><td>${s?s.meetings:'-'}</td><td><button class="btn" data-e="${k}">Modifier</button></td></tr>`).join('')}</table>`;
    document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { S.editDay = b.dataset.e; vSaisie(); });
  };
  histLoad(day); lastRender();
}

async function vClassement(){
  view().innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px">${[['jour','Aujourd\'hui'],['semaine','Semaine'],['mois','Mois']].map(([k,l])=>`<button class="btn ${S.period===k?'pri':''}" data-p="${k}">${l}</button>`).join('')}</div><div id="rk" class="mut">Chargement…</div></div>`;
  view().querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.period = b.dataset.p; vClassement(); });
  const now = new Date(); let from = new Date(now);
  if(S.period==='semaine') from.setDate(now.getDate() - ((now.getDay()+6)%7));
  if(S.period==='mois') from = new Date(now.getFullYear(), now.getMonth(), 1);
  const { data, error } = await sb.rpc('get_ranking', { p_from: ymd(from), p_to: ymd(now) });
  if(error) return document.getElementById('rk').textContent = error.message;
  const list = data||[]; const i = list.findIndex(x=>x.user_id===S.user.id);
  const show = new Set([0,1,2]); if(i>=0){ [i-1,i,i+1].forEach(k=>{ if(k>=0&&k<list.length) show.add(k); }); }
  const idx = [...show].sort((a,b)=>a-b);
  let html = '<table><tr><th>#</th><th>Nom</th><th>RDV</th><th>Décrochés</th><th>Appels</th></tr>'; let prev=-1;
  idx.forEach(k=>{ const r = list[k]; if(prev>=0 && k>prev+1) html += '<tr><td colspan="5" class="mut">…</td></tr>';
    html += `<tr class="${r.user_id===S.user.id?'me':''}"><td>${r.rank}</td><td>${esc(r.name)}${r.user_id===S.user.id?' (toi)':''}</td><td>${r.meetings}</td><td>${r.answered}</td><td>${r.calls}</td></tr>`; prev=k; });
  html += '</table>';
  if(i>0){ const a = list[i-1]; const gap = (a.meetings - list[i].meetings); html += `<p class="mut">Devant toi : ${esc(a.name)} (${gap>0?gap+' RDV d\'écart':'à égalité en RDV, '+(a.answered-list[i].answered)+' décrochés d\'écart'})</p>`; }
  if(i===0) html += '<p>🏆 Tu es en tête !</p>';
  document.getElementById('rk').innerHTML = html + '<p class="mut" style="font-size:13px">Classement : rendez-vous pris, puis décrochés.</p>';
}

function vFormation(){
  if(!S.lessons.length){ view().innerHTML = '<div class="card">Aucune leçon pour le moment.</div>'; return; }
  const cur = S.lessons.find(l=>l.id===S.openLesson) || S.lessons[0];
  const dn = S.lessons.filter(l=>S.ldone.has(l.id)).length;
  view().innerHTML = `<div class="card"><h2>Formation <span class="mut">(${dn}/${S.lessons.length} vues)</span></h2>
    <div class="grid" style="grid-template-columns:2fr 1fr;align-items:start">
    <div><iframe style="aspect-ratio:16/9" src="https://www.youtube-nocookie.com/embed/${esc(cur.youtube_id)}?rel=0&modestbranding=1" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <h3 style="margin-top:10px">${esc(cur.title)}</h3>
    <label class="chk" style="color:var(--tx);font-size:15px;margin:0"><input type="checkbox" id="seen" ${S.ldone.has(cur.id)?'checked':''}>J'ai vu cette vidéo</label></div>
    <div>${S.lessons.map(l=>`<div class="chk"><span>${S.ldone.has(l.id)?'✅':'▶️'}</span><a href="#" data-l="${l.id}" style="color:var(--tx);${l.id===cur.id?'font-weight:700':''}">${esc(l.title)}</a></div>`).join('')}</div></div></div>`;
  view().querySelectorAll('[data-l]').forEach(a => a.onclick = e => { e.preventDefault(); S.openLesson = +a.dataset.l; vFormation(); });
  document.getElementById('seen').onchange = async e => {
    if(e.target.checked){ await sb.from('lessons_done').insert({user_id:S.user.id,lesson_id:cur.id}); S.ldone.add(cur.id); }
    else { await sb.from('lessons_done').delete().eq('user_id',S.user.id).eq('lesson_id',cur.id); S.ldone.delete(cur.id); }
    vFormation();
  };
}

function vScripts(){
  view().innerHTML = NOTION_URL
    ? `<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Scripts & objections</h2><a class="btn" href="${esc(NOTION_URL)}" target="_blank" rel="noopener" style="margin-left:auto">Ouvrir en plein écran</a></div><iframe style="height:75vh;background:#fff" src="${esc(NOTION_URL)}"></iframe></div>`
    : '<div class="card">Les scripts arrivent bientôt.</div>';
}

async function vAdmin(){
  view().innerHTML = '<div class="card">Chargement…</div>';
  const from = new Date(); from.setDate(1);
  const [pr, st, cd, ld] = await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('daily_stats').select('*').gte('day', ymd(from)),
    sb.from('checklist_done').select('user_id'), sb.from('lessons_done').select('user_id')
  ]);
  const t = today();
  const rows = (pr.data||[]).filter(p=>p.role==='caller').map(p=>{
    const mine = (st.data||[]).filter(s=>s.user_id===p.id); const sum = k => mine.reduce((a,s)=>a+s[k],0);
    const td = mine.find(s=>s.day===t);
    return `<tr><td>${esc(p.name)}</td><td>${td?td.answered:'-'}</td><td>${sum('calls')}</td><td>${sum('answered')}</td><td>${sum('meetings')}</td><td>${(cd.data||[]).filter(x=>x.user_id===p.id).length}/${S.items.length}</td><td>${(ld.data||[]).filter(x=>x.user_id===p.id).length}/${S.lessons.length}</td></tr>`;
  }).join('');
  view().innerHTML = `<div class="card"><h2>Callers (mois en cours)</h2><div style="overflow:auto"><table><tr><th>Nom</th><th>Décrochés auj.</th><th>Appels</th><th>Décrochés</th><th>RDV</th><th>Roadmap</th><th>Vidéos</th></tr>${rows||'<tr><td colspan=7>Aucun caller.</td></tr>'}</table></div>
  <p class="mut" style="font-size:13px">Ajout d'un caller : Supabase → Authentication → Add user (cocher « Auto confirm »).</p></div>`;
}

init();
</script>
</body>
</html>
